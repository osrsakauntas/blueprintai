name: LostKnowledge
version: 1.0.0
main: com.kodari.lostknowledge.LostKnowledgePlugin
api-version: '1.20'
author: Kodari
description: Brėžinių atradimas, tyrimai ir grobio vietų progresija.
softdepend: [RaceBorderProgression]
commands:
